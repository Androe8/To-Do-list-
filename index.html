<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Links-->
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/app.js"></script>
    <!--Google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <title>To-Do list App</title>
</head>
<body>

    <div class="container">
        <div class="title-container">
            <h1>To-Do List </h1>
            <img src="/wirte.png" alt="Notebook icon">
        </div>
            <form class="task-input-container" id="taskForm">
                <input type="text" id="taskInput" placeholder="Write your task here..." required>
                <button type="submit" class="add-btn" aria-label="New task input">+</button>
            </form>
            <ul id="taskList"> <h3>Task List</h3></ul>
            
        </div>
</body>
</html>
